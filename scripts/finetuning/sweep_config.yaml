# ─────────────────────────────────────────────────────────────────────────────
# Fine-tuning sweep configuration
# Used by scripts/finetuning/sweep.py + worker.py
# ─────────────────────────────────────────────────────────────────────────────

# ── Fine-tuning strategies ────────────────────────────────────────────────────
#   finetune-full      pretrained weights; train everything
#   finetune-probe     pretrained weights; freeze encoder; train readout only
#   random-init-full   randomise ALL weights; train everything
#   random-init-probe  randomise ALL weights; freeze encoder; train readout only
modes:
  # - finetune-full
  # - finetune-probe
  - random-init-full
  - random-init-probe

# ── Few-shot fractions of training data ───────────────────────────────────────
fractions:
  - 0.01   # 1%
  - 0.05    # 5%
  - 0.15    # 15%
  #- 0.30    # 30%
  #- 0.50    # 50%
  #- 1.00    # 100%

# ── Downstream readout pooling (graph-level aggregation) ─────────────────────
#   options: mean | sum | max  — each entry becomes a separate sweep dimension
poolings:
  - mean
  - sum

# ── Training ─────────────────────────────────────────────────────────────────
max_epochs: 400
patience: 10        # EarlyStopping patience (on dataset monitor_metric)

# Fixed seed for few-shot subset selection (data split never changes across repeats).
seed: 42

# Independent training seeds — each entry is one full repeat of the experiment.
# When seed_subsample=false (default): controls model init + training stochasticity only;
#   the few-shot subset is identical across all seeds (subset seed = `seed` above).
# When seed_subsample=true: each train_seed also selects a DIFFERENT random subsample
#   of the training fraction, so repeats differ in both data and model initialisation.
#   This is more scientifically correct for few-shot evaluation.
train_seeds: [0, 1, 2, 3]

# Subsample-seed mode (see above).
# false → fixed subset for all seeds (legacy behaviour)
# true  → each train_seed independently resamples the training fraction
seed_subsample: true

# W&B project suffix appended when seed_subsample=true.
# Runs land in  finetune_<project><suffix>  instead of  finetune_<project>
# so the two experimental designs are kept in separate W&B projects.
seed_subsample_project_suffix: _seedsub

# Batch size for fine-tuning. null = inherit from the pretrained run config.
batch_size: null

# ── W&B projects ─────────────────────────────────────────────────────────────
# Pretrained projects to sweep over.  Each maps automatically to a finetune
# project called finetune_<project>.  Can be overridden by --projects on CLI.

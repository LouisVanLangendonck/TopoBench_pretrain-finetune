# ─────────────────────────────────────────────────────────────────────────────
# Fine-tuning sweep configuration
# Used by scripts/finetuning/sweep.py + worker.py
# ─────────────────────────────────────────────────────────────────────────────

# ── Fine-tuning strategies ────────────────────────────────────────────────────
#   finetune-full      pretrained weights; train everything
#   finetune-probe     pretrained weights; freeze encoder; train readout only
#   random-init-full   randomise ALL weights; train everything
#   random-init-probe  randomise ALL weights; freeze encoder; train readout only
modes:
  - finetune-full
  - finetune-probe
  - random-init-full
  - random-init-probe

# ── Few-shot fractions of training data ───────────────────────────────────────
fractions:
  - 0.05    # 5%
  - 0.50    # 50%
  - 1.00    # 100%

# ── Downstream readout pooling (graph-level aggregation) ─────────────────────
#   options: mean | sum | max  — each entry becomes a separate sweep dimension
poolings:
  - mean
  - sum

# ── Training ─────────────────────────────────────────────────────────────────
max_epochs: 400
patience: 10        # EarlyStopping patience (on dataset monitor_metric)

# Fixed seed for few-shot subset selection (data split never changes across repeats).
seed: 42

# Independent training seeds — each entry is one full repeat of the experiment.
# Controls model initialisation + training stochasticity ONLY.
# Data splits and few-shot subsets are identical across all seeds.
train_seeds: [0, 1, 2]

# Batch size for fine-tuning. null = inherit from the pretrained run config.
batch_size: null

# ── W&B projects ─────────────────────────────────────────────────────────────
# Pretrained projects to sweep over.  Each maps automatically to a finetune
# project called finetune_<project>.  Can be overridden by --projects on CLI.
entity: louis-van-langendonck-universitat-polit-cnica-de-catalunya
projects:
  # - gin_pretrain_sweep_graphmaev2_IMDB-BINARY
  # - gin_pretrain_sweep_graphmaev2_MUTAG
  # - gin_pretrain_sweep_graphmaev2_PROTEINS
  - gin_pretrain_sweep_graphmaev2_Caco2_Wang
  - gin_pretrain_sweep_graphmaev2_Clearance_Hepatocyte_AZ
  - gin_pretrain_sweep_graphmaev2_ogbg-molbace
  - gin_pretrain_sweep_dgi_IMDB-BINARY
  - gin_pretrain_sweep_dgi_MUTAG
  - gin_pretrain_sweep_dgi_PROTEINS
  - gin_pretrain_sweep_dgi_Caco2_Wang
  - gin_pretrain_sweep_dgi_Clearance_Hepatocyte_AZ
  - gin_pretrain_sweep_dgi_ogbg-molbace
  - gin_pretrain_sweep_graphcl_IMDB-BINARY
  - gin_pretrain_sweep_graphcl_MUTAG
  - gin_pretrain_sweep_graphcl_PROTEINS
  - gin_pretrain_sweep_graphcl_Caco2_Wang
  - gin_pretrain_sweep_graphcl_Clearance_Hepatocyte_AZ
  - gin_pretrain_sweep_graphcl_ogbg-molbace

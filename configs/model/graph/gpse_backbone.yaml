_target_: topobench.model.TBModel

model_name: gpse_backbone
model_domain: graph

feature_encoder:
  _target_: topobench.nn.encoders.${model.feature_encoder.encoder_name}
  encoder_name: AllCellFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}}
  out_channels: 128
  proj_dropout: 0.0
  graph_norm: false  # set to true to enable GraphNorm before the linear projection

backbone:
  _target_: topobench.nn.backbones.GPSEBackbone
  in_channels: ${model.feature_encoder.out_channels}
  hidden_channels: ${model.feature_encoder.out_channels}
  num_layers: 5         # number of ResGatedGraphConv message-passing layers
  layers_pre_mp: 1       # MLP layers before message passing
  stage_type: skipconcat    # residual strategy: skipsum | skipconcat | none
  has_bn: true
  has_l2norm: true
  final_l2norm: true
  dropout: 0.2
  act: relu
  # Set to ${model.feature_encoder.out_channels} to use edge features, or null
  # to ignore them.  When non-null the EdgeAttrGNNWrapper passes encoded x_1
  # as edge_attr to every ResGatedGraphConv layer.
  edge_dim: ${model.feature_encoder.out_channels}

backbone_wrapper:
  _target_: topobench.nn.wrappers.${model.backbone_wrapper.wrapper_name}
  _partial_: true
  wrapper_name: EdgeAttrGNNWrapper
  out_channels: ${model.feature_encoder.out_channels}
  residual_connections: false
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}

readout:
  _target_: topobench.nn.readouts.${model.readout.readout_name}
  readout_name: MLPReadout
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}
  in_channels: ${model.feature_encoder.out_channels}
  hidden_layers: []
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${define_task_level:${dataset.parameters.task_level},${dataset.split_params.learning_setting}}
  pooling_type: sum
  dropout: 0.2
  act: "relu"
  norm: null
  final_act: null

# compile model for faster training with pytorch 2.0
compile: false

# path to root directory (set automatically by rootutils from .project-root marker)
root_dir: ${oc.env:PROJECT_ROOT}

# Base directory for all large outputs (datasets, logs, checkpoints).
# Override by setting TB_SAVE_DIR in your .env file (already git-ignored).
# Falls back to the project root so the default behaviour is unchanged.
save_dir: ${oc.env:TB_SAVE_DIR,${paths.root_dir}}

# path to data directory
data_dir: ${paths.save_dir}/TB/datasets

# path to logging directory
log_dir: ${paths.save_dir}/TB/logs

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}
